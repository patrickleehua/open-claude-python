[project]
name = "open-claude-python"
version = "0.1.0"
description = "Python implementation of Claude Code CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=3.0.0",
    "anthropic>=0.49.0",
    "pydantic>=2.10.0",
    "mcp>=1.6.0",
    "keyring>=25.6.0",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "pyyaml>=6.0",
    "filelock>=3.16.0",
]

[project.scripts]
claude-py = "open_claude.cli:app"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
]
